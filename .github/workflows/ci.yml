name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-redis.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit bandit
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: python -m pytest --cov=src --cov=app --cov-report=term-missing --cov-report=xml -q
        env:
          SECRET_KEY: hashguard-ci-test-key
          BASELINE_HMAC_KEY: hashguard-ci-baseline-test-key
      - name: Security scan
        run: |
          pip-audit -r requirements-dev.txt
          pip-audit -r requirements-redis.txt
          bandit -r src app.py -ll
